services:
  opendocbot:
    build: .
    image: opendocbot
    container_name: opendocbot
    ports:
      - "${OPENDOCBOT_HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
      - HOST=${HOST:-0.0.0.0}
      - DIST_DIR=${DIST_DIR:-/app/dist}
      - TLS_CERT=${TLS_CERT:-}
      - TLS_KEY=${TLS_KEY:-}
      - OPENDOCBOT_MANAGED_CONFIG=${OPENDOCBOT_MANAGED_CONFIG:-}
      - OPENDOCBOT_MANAGED_CONFIG_FILE=${OPENDOCBOT_MANAGED_CONFIG_FILE:-}
      - OPENDOCBOT_MANAGED_REQUIRE_SSO=${OPENDOCBOT_MANAGED_REQUIRE_SSO:-true}
      - OPENDOCBOT_OIDC_ISSUER=${OPENDOCBOT_OIDC_ISSUER:-}
      - OPENDOCBOT_OIDC_CLIENT_ID=${OPENDOCBOT_OIDC_CLIENT_ID:-}
      - OPENDOCBOT_OIDC_CLIENT_SECRET=${OPENDOCBOT_OIDC_CLIENT_SECRET:-}
      - OPENDOCBOT_OIDC_SCOPES=${OPENDOCBOT_OIDC_SCOPES:-}
      - OPENDOCBOT_OIDC_ALLOWED_GROUPS=${OPENDOCBOT_OIDC_ALLOWED_GROUPS:-}
      - OPENDOCBOT_OIDC_GROUPS_CLAIM=${OPENDOCBOT_OIDC_GROUPS_CLAIM:-}
      - OPENDOCBOT_OIDC_REDIRECT_URI=${OPENDOCBOT_OIDC_REDIRECT_URI:-}
      - OPENDOCBOT_SESSION_STORE=${OPENDOCBOT_SESSION_STORE:-/data/opendocbot-sessions.json}
      - OPENDOCBOT_SESSION_SECRET=${OPENDOCBOT_SESSION_SECRET:-}
    volumes:
      # Persists sessions across restarts so users sign in once.
      - opendocbot-data:/data
    restart: always

volumes:
  opendocbot-data:
